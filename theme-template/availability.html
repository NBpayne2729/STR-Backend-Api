<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JRNP Rentals · Availability</title>
    <link rel="stylesheet" href="./theme.css" />

        <nav class="hero__nav" aria-label="Theme pages">
          <ul class="nav">
            <li><a href="./index.html">Overview</a></li>
